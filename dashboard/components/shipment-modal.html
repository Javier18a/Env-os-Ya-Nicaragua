<!-- =========================================================
     MODAL DETALLE DEL ENVÍO
========================================================== -->

<div class="modal-overlay"
    id="shipmentModal"
    aria-hidden="true">

    <div class="modal">

        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="modal-header">

            <div>

                <span class="section-label">
                    DETALLE DEL ENVÍO
                </span>

                <h3 id="modalShipmentTitle">
                    —
                </h3>

            </div>


            <button
                class="modal-close"
                id="closeModal"
                aria-label="Cerrar">

                &times;

            </button>

        </div>


        <!-- =================================================
             INFORMACIÓN
        ================================================== -->

        <div class="modal-body">

            <div class="shipment-summary">

                <div>
                    <span>
                        Cliente
                    </span>

                    <strong id="modalClient">
                        —
                    </strong>
                </div>


                <div>
                    <span>
                        Estado
                    </span>

                    <strong id="modalStatus">
                        —
                    </strong>
                </div>


                <div>
                    <span>
                        Operación
                    </span>

                    <strong id="modalOperation">
                        —
                    </strong>
                </div>


                <div>
                    <span>
                        Transporte
                    </span>

                    <strong id="modalTransport">
                        —
                    </strong>
                </div>


                <div>
                    <span>
                        Paquetes
                    </span>

                    <strong id="modalPackageQuantity">
                        —
                    </strong>
                </div>


                <div>
                    <span>
                        Peso
                    </span>

                    <strong id="modalWeight">
                        —
                    </strong>
                </div>


                <div>
                    <span>
                        Volumen
                    </span>

                    <strong id="modalVolume">
                        —
                    </strong>
                </div>


                <div>
                    <span>
                        Tipo de paquete
                    </span>

                    <strong id="modalPackageType">
                        —
                    </strong>
                </div>


                <div>
                    <span>
                        Categoría
                    </span>

                    <strong id="modalCategory">
                        —
                    </strong>
                </div>


                <div>
                    <span>
                        Origen
                    </span>

                    <strong id="modalOrigin">
                        —
                    </strong>
                </div>


                <div>
                    <span>
                        Destino
                    </span>

                    <strong id="modalDestination">
                        —
                    </strong>
                </div>


                <div>
                    <span>
                        Remitente
                    </span>

                    <strong id="modalSender">
                        —
                    </strong>
                </div>


                <div>
                    <span>
                        Destinatario
                    </span>

                    <strong id="modalRecipient">
                        —
                    </strong>
                </div>


                <div>
                    <span>
                        Fecha
                    </span>

                    <strong id="modalDate">
                        —
                    </strong>
                </div>

            </div>


            <!-- =================================================
                 HISTORIAL
            ================================================== -->

            <div class="tracking">

                <h4>
                    Historial del envío
                </h4>

                <div
                    class="tracking-timeline"
                    id="modalTrackingTimeline">
                </div>

            </div>

        </div>


        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="modal-footer">

            <button
                class="secondary-button"
                id="closeModalButton">

                Cerrar

            </button>

        </div>

    </div>

</div>
